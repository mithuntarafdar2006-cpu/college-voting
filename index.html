<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Online Voting</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <section id="login" class="sheet narrow" hidden>
    <h1>Campus Ballot</h1>
    <p class="muted">Sign in with your student ID to vote.</p>
    <form id="loginForm">
      <label>Student ID <input name="student_id" required autocomplete="username"></label>
      <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
      <button class="primary">Sign in</button>
      <p class="msg" role="alert" id="loginMsg"></p>
    </form>
    <p class="muted switch">New here? <button class="link" data-view="register">Create an account</button></p>
  </section>

  <section id="register" class="sheet narrow" hidden>
    <h1>Register to vote</h1>
    <p class="muted">Use your college student ID. You can register once.</p>
    <form id="registerForm">
      <label>Full name <input name="name" required minlength="2" maxlength="100" autocomplete="name"></label>
      <label>Student ID <input name="student_id" required pattern="[A-Za-z0-9_\-]{3,30}" title="3-30 letters, numbers, - or _" autocomplete="username"></label>
      <label>Password <input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
      <label>Confirm password <input name="confirm" type="password" required minlength="6" autocomplete="new-password"></label>
      <button class="primary">Register</button>
      <p class="msg" role="alert" id="regMsg"></p>
    </form>
    <p class="muted switch">Already registered? <button class="link" data-view="login">Sign in</button></p>
  </section>

  <section id="app" hidden>
    <header>
      <div><h1 id="title"></h1><span id="status" class="badge"></span></div>
      <div class="who"><span id="who"></span><button id="logout" class="ghost">Log out</button></div>
    </header>
    <nav>
      <button class="tab active" data-tab="ballot">Ballot</button>
      <button class="tab" data-tab="results">Results</button>
      <button class="tab" data-tab="admin" id="adminTab" hidden>Admin</button>
    </nav>

    <div id="ballot" class="panel"></div>
    <div id="results" class="panel" hidden></div>
    <div id="admin" class="panel" hidden>
      <div class="sheet"><h2>Election</h2><button id="toggle" class="primary"></button></div>
      <form class="sheet" data-action="add_candidate">
        <h2>Add candidate</h2>
        <input name="name" placeholder="Full name" required>
        <input name="post" placeholder="Post (e.g. President)" required>
        <input name="department" placeholder="Department">
        <textarea name="manifesto" placeholder="Manifesto (max 500 characters)" maxlength="500"></textarea>
        <button class="primary">Add candidate</button><p class="msg" role="status"></p>
      </form>
      <form class="sheet" data-action="add_student">
        <h2>Add student</h2>
        <input name="student_id" placeholder="Student ID" required>
        <input name="name" placeholder="Full name" required>
        <input name="password" type="password" placeholder="Password (6+ characters)" minlength="6" required>
        <button class="primary">Add student</button><p class="msg" role="status"></p>
      </form>
    </div>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
